<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMaxYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="1250" cy="130" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fb923c" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdba74" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fdba74" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fdba74" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="600" fill="url(#glow)"/>
  <!-- track lanes converging to the horizon -->
  <g stroke="#fff" stroke-opacity=".16" stroke-width="2" fill="none">
    <line x1="560"  y1="620" x2="1250" y2="130"/>
    <line x1="760"  y1="620" x2="1250" y2="130"/>
    <line x1="960"  y1="620" x2="1250" y2="130"/>
    <line x1="1160" y1="620" x2="1250" y2="130"/>
    <line x1="1360" y1="620" x2="1250" y2="130"/>
    <line x1="1560" y1="620" x2="1250" y2="130"/>
    <line x1="1760" y1="620" x2="1250" y2="130"/>
    <line x1="1960" y1="620" x2="1250" y2="130"/>
  </g>
  <!-- lane cross marks -->
  <g stroke="#fff" stroke-opacity=".10" stroke-width="2">
    <line x1="0" y1="250" x2="1600" y2="250"/>
    <line x1="0" y1="340" x2="1600" y2="340"/>
    <line x1="0" y1="450" x2="1600" y2="450"/>
  </g>
  <!-- speed streaks -->
  <g transform="rotate(18 1250 300)">
    <rect x="1050" y="-100" width="10" height="800" fill="url(#streak)"/>
    <rect x="1120" y="-100" width="4"  height="800" fill="url(#streak)"/>
    <rect x="1380" y="-100" width="14" height="800" fill="url(#streak)"/>
  </g>
</svg>